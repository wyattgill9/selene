[workspace]
resolver = "3"
members = ["crates/selene"]
default-members = ["crates/selene"]

[workspace.package]
version = "0.1.0"
authors = ["Wyatt Gill <wyattgill01@outlook.com>"]
edition = "2024"
description = "Shard-per-core io_uring backend framework"
readme = "README.md"
repository = "https://github.com/wyattgill9/selene"
license = "MIT"

# DESIGN_V1 §6.2: no RefCell borrow held across .await.
# DESIGN_V1 §3.2: the "never use std::mutex" social rule becomes a lint.
[workspace.lints.clippy]
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"

# crane reads these for the deps-only/clippy/test derivations (no root [package] here).
[workspace.metadata.crane]
name = "selene"
